# muram/sdo/mhs
# Run-defining settings and overrides; omitted options use schema defaults.
schema_version: 5
solver:
  kind: joint
  output_directory: /glade/work/rjarolim/lte/muram_validation_mhs_single_frame_vector_potential_v01
  work_directory: /glade/derecho/scratch/rjarolim/lte/muram_validation_mhs_single_frame_vector_potential_v01
scene:
  reference_stream: photospheric_stokes
  time_window:
    start: '2010-03-24T00:00:00'
    end: '2010-03-24T00:00:01'
atmosphere:
  geometry:
    type: spherical_shell
    time_dependent: false
    height_input_scale_m: 10000000.0
    outer_height_megameter: 30.0
    inner_height_megameter: -0.5
    tangent_margin_m: 1000.0
    line_formation_outer_height_megameter: 1.5
    uniform_spatial_scaling: true
  reference_atmosphere: falc_82
  parameters:
    temperature:
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
    magnetic_field:
      scale_gauss: 100.0
      representation: vector_potential
    microturbulence:
      log_scale: 0.2
    gas_pressure:
      log_scale: 0.5
  network:
    type: siren
    hidden_dimension: 256
    hidden_layers: 8
    radial_weighting: null
  upper_atmosphere:
    type: hydrostatic_corona
    transition_region_top_megameter: 2.5
    coronal_temperature_k: 1000000.0
synthesis:
  windows:
    - id: fe_i_6173
      line_ids:
        - FeI_6173.3352
      wavelength_bounds_vacuum_angstrom:
        - 6172.0
        - 6179.0
      radiance_scale: 25000000000000.0
      depth_count: 257
      jitter_fraction: 1.0
      transfer_precision: float32
      shell_height_bounds_megameter:
        - -0.5
        - 1.5
      lateral_halo_megameter: 5.0
physics:
  vector_basis_matches_spatial_coordinates: true
  collocation:
    volume_points_per_step: 2048
    height_layers_per_step: 64
    upper_boundary_points_per_step: 256
    validation_height_layers: 12
    validation_points_per_height: 32
    upper_volume_points_per_step: 1024
    upper_height_layers_per_step: 32
    side_boundary_points_per_step: 512
    validation_side_boundary_points: 256
    validation_upper_height_layers: 6
    height_sampling_power: 2.5
    volume_sampling: fully_random
    hard_example_enabled: true
    hard_example_count: 256
    hard_example_start_step: 500
  normalization:
    length_m: 1000000.0
    time_s: 3600.0
    force_balance_pressure_floor_pa: 1.0
  equations:
    magnetohydrostatic_equilibrium:
      enabled: true
      weight: 0.001
    upper_boundary_gas_pressure_prior:
      enabled: true
      weight: 0.0001
    vector_potential_gauge:
      enabled: true
      weight: 0.1
  potential_boundary:
    enabled: true
    ramp_steps: 1000
    update_every_n_steps: 1000
    weight: 0.01
    photosphere:
      enabled: true
      minimum_horizontal_field_gauss: 1.0
      start_step: 1000
      ramp_steps: 1000
      end_step: 10000
  loss_ramp_steps: 2000
atmosphere_regularization: []
streams:
  - id: photospheric_stokes
    observation:
      type: hmi_stokes
      binning: 4  # Average native synthesis pixels during loading.
      directory: ${MURAM_SDO:-/glade/derecho/scratch/rjarolim/muram_synthetic_observations/sdo}/hmi/prepared
      selection:
        acquisition_indices:
          - 0
      loader:
        batch_size: 64
        validation_batch_size: 64
        validation_stride: 16
        preparation_workers: 8
        workers: 8
      calibration:
        transmission_profile_directory: ${MURAM_SDO:-/glade/derecho/scratch/rjarolim/muram_synthetic_observations/sdo}/hmi/responses
        require_quality_zero: true
        quiet_sun_max_fractional_polarization: 0.01
        quiet_sun_trim_quantiles:
          - 0.05
          - 0.95
        minimum_quiet_sun_pixels: 128
        calibration_sample_limit: 4096
    data_term:
      type: lte_stokes
      synthesis_window: fe_i_6173
      weight: 1.0
      instrument:
        type: hmi_filter_profiles
        magnetic_azimuth_offset_deg: 90.0
      objective:
        type: mse
        stokes_weights: {i: 1.0, q: 1.0, u: 1.0, v: 1.0}
        qu_warmup_steps: 0
        continuum_normalization: true
        stokes_scales: {I: 1.0, Q: 0.1, U: 0.1, V: 0.1}
diagnostics:
  visualization:
    enabled: true
    ray_sampling:
      batch_size: 128
      max_pixels: 4096
      max_profile_samples: 2048
    slice_sampling:
      batch_size: 512
      longitude_points: 128
      latitude_points: 128
      radial_points: 256
    meridional_slice:
      enabled: true
      longitude_deg: 0.0
    contribution_ray_count: 0
training:
  max_steps: -1
  learning_rate: 0.0001
  final_learning_rate: 1.0e-05
  optimizer: muon
  max_epochs: 500
  reference_stream: photospheric_stokes
logging:
  type: wandb
  project: PROM3THEUS
  run_name: MURaM HMI continuum-linear vector potential single-frame MHS
  tags:
    - muram
    - synthetic
    - hmi
    - validation
    - single-frame
    - mhs
