# muram/hinode/mhs
# Run-defining settings and overrides; omitted options use schema defaults.
schema_version: 5
solver:
  kind: joint
  output_directory: /glade/work/rjarolim/lte/muram_hinode_ar11158_2000000_mhs_exact_lte_soap_uniform32
  work_directory: /glade/derecho/scratch/rjarolim/lte/muram_hinode_ar11158_2000000_mhs_exact_lte_soap_uniform32
scene:
  reference_stream: photospheric_stokes
atmosphere:
  geometry:
    type: spherical_shell
    time_dependent: false
    height_input_scale_m: 10000000.0
    outer_height_megameter: 1.0
    inner_height_megameter: -1.0
    tangent_margin_m: 1000.0
    line_formation_outer_height_megameter: 1.0
    uniform_spatial_scaling: true
  reference_atmosphere: falc_82
  parameters:
    temperature:
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
    magnetic_field:
      scale_gauss: 1000.0
    microturbulence:
      log_scale: 0.2
    gas_pressure:
      log_scale: 0.5
  network:
    type: siren
    hidden_dimension: 256
    hidden_layers: 8
    radial_weighting: null
    first_omega_0: 1
synthesis:
  windows:
    - id: fe_i_6302
      coefficient_backend: exact_lte
      line_ids:
        - FeI_6301.5008
        - FeI_6302.4932
      wavelength_bounds_vacuum_angstrom:
        - 6300.0
        - 6307.0
      radiance_scale: 25000000000000.0
      depth_count: 32
      coarse_to_fine:
        enabled: false
      jitter_fraction: 0.0
      shell_height_bounds_megameter:
        - -1.0
        - 1.0
      lateral_halo_megameter: 0.2  # Allow edge rays to reach the lower spherical boundary.
physics:
  vector_basis_matches_spatial_coordinates: true
  collocation:
    volume_sampling: uniform_volume
    volume_points_per_step: 2048
    validation_volume_points: 384
  normalization:
    length_m: 1000000.0
    time_s: 3600.0
    normalize_force_balance: false
  equations:
    magnetic_divergence:
      enabled: false
      weight: 0.0
    magnetic_current_free:
      enabled: false
      weight: 0.0
    hydrostatic_equilibrium:
      enabled: true
      weight: 0.01
streams:
  - id: photospheric_stokes
    observation:
      type: muram_stored
      binning: 1  # Use the stored spectra at their original resolution.
      directory: /glade/derecho/scratch/rjarolim/muram_synthetic_observations/hinode_ar11158_2000000_uniform32
      loader:
        workers: 4
        batch_size: 1024  # Per GPU: 4096 rays per update across the four-GPU job.
        validation_batch_size: 16
        validation_stride: 16
    data_term:
      type: lte_stokes
      synthesis_window: fe_i_6302
      weight: 1.0
      instrument:
        type: hinode_sp
        spectral_psf:
          type: gaussian
          fwhm_angstrom: 0.025
          oversample: 4
          truncate_sigma: 4.0
      objective:
        type: mse
        stokes_weights: {i: 10.0, q: 1.0, u: 1.0, v: 1.0}
        continuum_normalization: true
        stokes_scales: {I: 1.0, Q: 0.1, U: 0.1, V: 0.1}
diagnostics:
  visualization:
    ray_sampling:
      batch_size: 16
      max_pixels: 65536
      max_profile_samples: 2048
    slice_sampling:
      batch_size: 512
      longitude_points: 128
      latitude_points: 128
      radial_points: 256
    meridional_slice:
      enabled: true
      longitude_deg: 2.0
training:
  max_steps: -1
  learning_rate: 0.001
  final_learning_rate: 0.0001
  optimizer: soap
  device: cuda
  steps_per_epoch: 1000
  learning_rate_decay_steps: 10000
logging:
  type: wandb
  project: PROM3THEUS
  run_name: MURaM Hinode SIREN SOAP in-domain MHS
  tags:
    - mhs
