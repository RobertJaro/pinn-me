# Time-dependent LTE inversion of prepared HMI 720-second subframe Stokes data.
#
# Paths are the literal server locations from the preserved operational run.
schema_version: 1

solver:
  kind: lte
  output_directory: /glade/work/rjarolim/spinn_me/hmi/subframe_20240323_physics_mlp_v09
  work_directory: /glade/derecho/scratch/rjarolim/spinn_me/subframe_20240323_mlp_v08

resources:
  # The wheel includes the checksum-pinned LTE tables for both instruments.
  bundle: packaged

# HMI Stokes ingestion and the phase-map filter-profile operator are explicit.
observation:
  type: hmi_stokes
  directory: /glade/work/rjarolim/data/hmi_stokes/20240323_720s_subframe
  selection:
    # Use the middle acquisition for deterministic validation; all train.
    validation_raster: 10
  loader:
    batch_size: 256
    validation_batch_size: 64
    validation_stride: 16
    preparation_workers: 8
    workers: 8
    pin_memory: true
    progress: true
  calibration:
    transmission_profile_directory: /glade/work/rjarolim/data/hmi_calibration/20240323
    require_quality_zero: true
    quiet_sun_max_fractional_polarization: 1.0e-2
    quiet_sun_trim_quantiles: [0.05, 0.95]
    minimum_quiet_sun_pixels: 128
    calibration_sample_limit: 4096

atmosphere:
  depth_grid:
    coordinate: log_tau500
    minimum: -5.0
    maximum: 1.0
    count: 51
  geometry:
    type: spherical_shell
    time_dependent: true
    height_input_scale_m: 1.0e+6
    outer_height_megameter: 1.5
    inner_height_megameter: -0.1
    tangent_margin_m: 1000.0
  reference_atmosphere: falc_82
  parameters:
    temperature:
      log10_bounds: [3.4, 4.0]
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
      maximum_m_per_s: 100000.0
    magnetic_field:
      scale_gauss: 100.0
    microturbulence:
      log10_bounds: [1.0, 4.0]
      log_scale: 0.2
    gas_pressure:
      log10_bounds: [-1.5, 6.0]
      log_scale: 0.5
  network:
    type: mlp
    hidden_dimension: 256
    hidden_layers: 8
    activation: silu
    encoding:
      type: fourier
      # Carrington X/Y, radial height, normalized observation time.
      num_frequencies: [64, 64, 16, 8]
      max_frequencies: [64, 64, 16, 2]
      include_input: true

synthesis:
  line_ids: [FeI_6173.3352]
  excluded_wavelength_windows_angstrom: []

instrument:
  # Uses each acquisition's prepared phase-map response rather than a Gaussian.
  type: hmi_filter_profiles
  # Explicit initial global line-zero-point correction; optimized during fitting.
  radial_velocity_correction_m_per_s: 0.0

training:
  depth_sampling:
    sample_count: 25
    coarse_to_fine:
      enabled: true
      fine_sample_count: 16
      uniform_weight_floor: 0.05
  # Explicitly disabled instead of inheriting an instrument-dependent default.
  vector_regularization:
    enabled: false
    magnetic_weight: 0.0
    velocity_weight: 0.0
    decay_steps: 0
  physics:
    vector_basis_matches_spatial_coordinates: true
    collocation:
      volume_points_per_step: 1024
      height_layers_per_step: 32
      upper_boundary_points_per_step: 256
      validation_height_layers: 8
      validation_points_per_height: 32
    normalization:
      length_m: 1.0e+6
      time_s: 3600.0
    equations:
      hydrostatic_equilibrium: {enabled: false, weight: 0.0}
      magnetohydrostatic_equilibrium: {enabled: false, weight: 0.0}
      momentum: {enabled: true, weight: 1.0e-3}
      magnetic_divergence: {enabled: true, weight: 1.0e-3}
      induction: {enabled: true, weight: 1.0e-3}
      continuity: {enabled: true, weight: 1.0e-3}
      upper_boundary_gas_pressure_prior: {enabled: true, weight: 1.0e-4}
  learning_rate:
    start: 1.0e-3
    end: 1.0e-4
    iterations: auto

loss:
  type: mse
  stokes_weights: {i: 1.0, q: 1.0, u: 1.0, v: 1.0}
  polarization_transform:
    type: asinh
    q_alpha: 1.0e-2
    u_alpha: 1.0e-2
    v_alpha: 1.0e-2

diagnostics:
  validation_every_n_epochs: 1
  visualization:
    enabled: true
    every_n_validations: 1
    ray_sampling:
      batch_size: 512
      max_pixels: 4096
      max_profile_samples: 2048
    slice_sampling:
      batch_size: 512
      layer_count: 4
      longitude_points: 128
      latitude_points: 128
      radial_points: 128
    dpi: 180
    meridional_slice:
      enabled: false
      longitude_deg: null
    include_initial: true

runtime:
  max_epochs: 500
  log_every_n_steps: 10
  validation_check_interval_steps: 1000
  gradient_clip_norm: null

logging:
  type: wandb
  project: PROM3THEUS
  tags: [hmi, sdo, fe6173, lte, time-dependent, spherical-shell, phase-map-response]
  run_name: HMI LTE 2024-03-23/24 time series
