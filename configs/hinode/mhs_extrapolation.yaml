# hinode/mhs_extrapolation
# Run-defining settings and overrides; omitted options use schema defaults.
schema_version: 5
solver:
  kind: joint
  output_directory: /glade/work/rjarolim/lte/hinode_mhs_extrapolation_v01
  work_directory: /glade/derecho/scratch/rjarolim/lte/hinode_mhs_extrapolation_v01
scene:
  reference_stream: photospheric_stokes
atmosphere:
  geometry:
    type: spherical_shell
    time_dependent: false
    height_input_scale_m: 10000000.0
    outer_height_megameter: 20.0
    inner_height_megameter: -0.5
    tangent_margin_m: 1000.0
    line_formation_outer_height_megameter: 1.5
  reference_atmosphere: falc_82
  parameters:
    temperature:
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
    magnetic_field:
      scale_gauss: 100.0
      representation: vector_potential
    microturbulence:
      log_scale: 0.2
    gas_pressure:
      log_scale: 0.5
  network:
    type: siren
    hidden_dimension: 256
    hidden_layers: 8
    radial_weighting: null
  upper_atmosphere:
    type: hydrostatic_corona
    transition_region_top_megameter: 2.5
    coronal_temperature_k: 1000000.0
synthesis:
  windows:
    - id: fe_i_6302
      line_ids:
        - FeI_6301.5008
        - FeI_6302.4932
      wavelength_bounds_vacuum_angstrom:
        - 6300.0
        - 6307.0
      radiance_scale: 25000000000000.0
      depth_count: 257
      jitter_fraction: 1.0
      transfer_precision: float32
      shell_height_bounds_megameter:
        - -0.5
        - 1.5
      lateral_halo_megameter: 5.0
physics:
  vector_basis_matches_spatial_coordinates: true
  collocation:
    volume_points_per_step: 2048
    height_layers_per_step: 64
    upper_boundary_points_per_step: 256
    validation_height_layers: 12
    validation_points_per_height: 32
    upper_volume_points_per_step: 1024
    upper_height_layers_per_step: 32
    validation_upper_height_layers: 6
    volume_sampling: fully_random
    hard_example_enabled: true
    hard_example_count: 256
    hard_example_start_step: 500
  normalization:
    length_m: 1000000.0
    time_s: 3600.0
    force_balance_pressure_floor_pa: 1.0
  equations:
    magnetohydrostatic_equilibrium:
      enabled: true
      weight: 0.001
    magnetic_divergence:
      enabled: true
      weight: 0.001
    upper_boundary_gas_pressure_prior:
      enabled: true
      weight: 0.0001
    vector_potential_gauge:
      enabled: true
      weight: 0.1
    upper_boundary_open_velocity:
      enabled: true
      weight: 1.0e-05
    upper_boundary_tangential_magnetic_neumann:
      enabled: true
      weight: 0.001
  loss_start_step: 500
  loss_ramp_steps: 2000
  robust_loss_delta: 1.0
atmosphere_regularization: []
streams:
  - id: photospheric_stokes
    observation:
      type: hinode_sp
      directory: /glade/work/rjarolim/data/inversion/hinode_2011_02/20110214_000004
      selection:
        slit_slice:
          start: 0
          stop: 512
      loader:
        batch_size: 128
        validation_batch_size: 64
        validation_stride: 16
        preparation_workers: 8
        workers: 8
      calibration:
        continuum_edge_samples: 8
        quiet_sun_max_fractional_polarization: 0.01
        quiet_sun_continuum_trim_quantiles:
          - 0.05
          - 0.95
        minimum_quiet_sun_pixels: 1024
    data_term:
      type: lte_stokes
      synthesis_window: fe_i_6302
      weight: 1.0
      instrument:
        type: hinode_sp
        spectral_psf:
          type: gaussian
          fwhm_angstrom: 0.025
          oversample: 4
          truncate_sigma: 4.0
      objective:
        type: mse
        stokes_weights: {i: 1.0, q: 1.0, u: 1.0, v: 1.0}
        qu_warmup_steps: 0
        continuum_normalization: true
        stokes_scales: {I: 1.0, Q: 0.1, U: 0.1, V: 0.1}
      excluded_wavelength_windows_angstrom:
        - - 6302.04
          - 6302.14
diagnostics:
  visualization:
    enabled: true
    ray_sampling:
      batch_size: 1024
      max_pixels: 16384
    slice_sampling:
      batch_size: 1024
      radial_points: 256
    meridional_slice:
      enabled: true
      longitude_deg: 36.0
    dpi: 220
training:
  max_steps: -1
  learning_rate: 0.0001
  final_learning_rate: 1.0e-05
  optimizer: muon
  max_epochs: 500
  reference_stream: photospheric_stokes
  loss_balance:
    enabled: false
    included_objectives:
      - shared.physics.magnetohydrostatic_equilibrium
      - shared.physics.magnetic_divergence
logging:
  type: wandb
  project: PROM3THEUS
  run_name: Hinode LTE MHS extrapolation 20110214_000004
  tags:
    - hinode
    - sot-sp
    - lte
    - mhs
    - extrapolation
    - magnetic-neumann-top
    - spherical-shell
    - carrington
    - full-resolution
    - '20110214_000004'
