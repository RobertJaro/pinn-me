# Static magnetohydrostatic LTE inversion of prepared HMI subframe Stokes data.
#
# One configurable acquisition constrains the static atmosphere. MHS and divB
# regularize the snapshot; no temporal derivatives or adiabatic evolution apply.
schema_version: 2

solver:
  kind: lte
  output_directory: /glade/work/rjarolim/lte/hmi_subframe_mhs_v01
  work_directory: /glade/derecho/scratch/rjarolim/lte/hmi_subframe_mhs_v01

resources:
  bundle: packaged

observation:
  type: hmi_stokes
  directory: /glade/work/rjarolim/data/hmi_stokes/20240323_720s_subframe
  selection:
    # Source-sequence indices are zero based. This static run uses one frame.
    acquisition_indices: [10]
    validation_raster: 10
  loader:
    batch_size: 256
    validation_batch_size: 64
    validation_stride: 16
    preparation_workers: 8
    workers: 8
    pin_memory: true
    progress: true
  calibration:
    transmission_profile_directory: /glade/work/rjarolim/data/hmi_calibration/20240323
    require_quality_zero: true
    quiet_sun_max_fractional_polarization: 1.0e-2
    quiet_sun_trim_quantiles: [0.05, 0.95]
    minimum_quiet_sun_pixels: 128
    calibration_sample_limit: 4096

atmosphere:
  depth_grid:
    coordinate: log_tau500
    minimum: -5.0
    maximum: 1.0
    count: 51
  geometry:
    type: spherical_shell
    time_dependent: false
    height_input_scale_m: 1.0e+6
    outer_height_megameter: 1.5
    line_formation_outer_height_megameter: 1.5
    inner_height_megameter: -0.1
    tangent_margin_m: 1000.0
  reference_atmosphere: falc_82
  parameters:
    temperature:
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
      maximum_m_per_s: 100000.0
    magnetic_field:
      scale_gauss: 100.0
    microturbulence:
      log_scale: 0.2
    gas_pressure:
      log_scale: 0.5
  network:
    type: mlp
    hidden_dimension: 256
    hidden_layers: 8
    activation: silu
    encoding:
      type: fourier
      num_frequencies: [64, 64, 16]
      max_frequencies: [64, 64, 16]
      include_input: true

synthesis:
  line_ids: [FeI_6173.3352]
  excluded_wavelength_windows_angstrom: []

instrument:
  type: hmi_filter_profiles

training:
  depth_sampling:
    sample_count: 25
    coarse_to_fine:
      enabled: true
      fine_sample_count: 16
      uniform_weight_floor: 0.05
  vector_regularization:
    enabled: false
    magnetic_weight: 0.0
    velocity_weight: 0.0
    decay_steps: 0
  physics:
    vector_basis_matches_spatial_coordinates: true
    adiabatic_index: 1.6666666666666667
    upper_boundary_current_free_ramp_steps: 0
    collocation:
      volume_points_per_step: 1024
      height_layers_per_step: 32
      upper_volume_points_per_step: 0
      upper_height_layers_per_step: 0
      upper_boundary_points_per_step: 256
      side_boundary_points_per_step: 0
      side_height_layers_per_step: 0
      validation_height_layers: 8
      validation_upper_height_layers: 0
      validation_points_per_height: 32
    normalization:
      length_m: 1.0e+6
      time_s: 3600.0
      magnetic_field_floor_gauss: 1.0
      velocity_scale_m_per_s: 1000.0
    equations:
      hydrostatic_equilibrium: {enabled: false, weight: 0.0}
      magnetohydrostatic_equilibrium: {enabled: true, weight: 1.0e-3}
      momentum: {enabled: false, weight: 0.0}
      magnetic_divergence: {enabled: true, weight: 1.0e-3}
      radial_magnetic_energy_gradient: {enabled: false, weight: 0.0}
      induction: {enabled: false, weight: 0.0}
      continuity: {enabled: false, weight: 0.0}
      adiabatic_pressure: {enabled: false, weight: 0.0}
      upper_boundary_open_velocity: {enabled: false, weight: 0.0}
      side_boundary_open_velocity: {enabled: false, weight: 0.0}
      upper_domain_microturbulence_prior: {enabled: false, weight: 0.0}
      upper_domain_temperature_prior: {enabled: false, weight: 0.0}
      upper_boundary_current_free: {enabled: false, weight: 0.0}
      side_boundary_current_free: {enabled: false, weight: 0.0}
      upper_boundary_gas_pressure_prior: {enabled: true, weight: 1.0e-4}
  learning_rate:
    start: 1.0e-3
    end: 1.0e-4
    iterations: auto

loss:
  type: huber
  # Effective errors in the stored disk-center atlas-continuum units. Stokes I
  # includes unresolved structure/model discrepancy; Q/U/V use the measured
  # quiet-Sun polarization floor of roughly 7e-4--8e-4.
  stokes_sigmas: {i: 5.0e-3, q: 8.0e-4, u: 8.0e-4, v: 8.0e-4}
  huber_delta: 1.0
  # Relative preferences are normalized to sum to one at runtime.
  stokes_weights: {i: 1.0, q: 1.0, u: 1.0, v: 1.0}

diagnostics:
  validation_every_n_epochs: 1
  visualization:
    enabled: true
    every_n_validations: 1
    ray_sampling:
      batch_size: 512
      max_pixels: 4096
      max_profile_samples: 2048
    slice_sampling:
      batch_size: 512
      layer_count: 6
      longitude_points: 128
      latitude_points: 128
      radial_points: 128
    dpi: 180
    meridional_slice:
      enabled: true
      longitude_deg: 215.0
    include_initial: true

runtime:
  max_epochs: 500
  log_every_n_steps: 10
  gradient_clip_norm: null

logging:
  type: wandb
  project: PROM3THEUS
  tags: [hmi, sdo, fe6173, lte, mhs, static, spherical-shell, phase-map-response]
  run_name: HMI LTE MHS 2024-03-23/24
