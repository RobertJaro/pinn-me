# Static Hinode/SOT-SP LTE inversion with an MHS upper-atmosphere extension.
#
# One shared PINN represents the complete -0.1--20.0 Mm shell. LTE line
# formation is evaluated only below 1.5 Mm; full-domain MHS/divB collocation,
# upper-domain thermodynamic priors and transmissive/external-pressure/current-free
# top conditions
# constrain the spectrally invisible extension.
schema_version: 2

solver:
  kind: lte
  output_directory: /glade/work/rjarolim/lte/hinode_mhs_extrapolation_v01
  work_directory: /glade/derecho/scratch/rjarolim/lte/hinode_mhs_extrapolation_v01

resources:
  bundle: packaged

observation:
  type: hinode_sp
  directory: /glade/work/rjarolim/data/inversion/hinode_2011_02/20110214_000004
  selection:
    slit_slice:
      start: 0
      stop: 512
  loader:
    batch_size: 128
    validation_batch_size: 64
    validation_stride: 16
    preparation_workers: 8
    workers: 8
    pin_memory: true
    progress: true
  calibration:
    continuum_edge_samples: 8
    quiet_sun_max_fractional_polarization: 1.0e-2
    quiet_sun_continuum_trim_quantiles: [0.05, 0.95]
    minimum_quiet_sun_pixels: 1024
    stokes_reference_angle_deg: 0.0

atmosphere:
  depth_grid:
    coordinate: log_tau500
    minimum: -5.0
    maximum: 1.0
    count: 51
  geometry:
    type: spherical_shell
    time_dependent: false
    height_input_scale_m: 1.0e+7
    # Full PINN/physics domain top.
    outer_height_megameter: 20.0
    # LTE rays retain the original, contribution-relevant atmosphere only.
    line_formation_outer_height_megameter: 1.5
    inner_height_megameter: -0.1
    tangent_margin_m: 1000.0
  reference_atmosphere: falc_82
  upper_atmosphere:
    type: hydrostatic_corona
    transition_region_top_megameter: 2.5
    coronal_temperature_k: 1.0e+6
    reference_grid_points: 2048
  parameters:
    temperature:
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
      maximum_m_per_s: 100000.0
    magnetic_field:
      scale_gauss: 100.0
    microturbulence:
      log_scale: 0.2
    gas_pressure:
      # The hydrostatic FALC-to-corona profile is the zero-residual reference;
      # the learned natural-log pressure residual is unbounded.
      log_scale: 0.5
  network:
    type: mlp
    hidden_dimension: 256
    hidden_layers: 8
    activation: silu
    encoding:
      type: fourier
      num_frequencies: [64, 64, 64]
      max_frequencies: [8, 8, 64]
      include_input: true

synthesis:
  line_ids: [FeI_6301.5008, FeI_6302.4932]
  excluded_wavelength_windows_angstrom: [[6302.04, 6302.14]]

instrument:
  type: hinode_sp
  spectral_psf:
    type: gaussian
    fwhm_angstrom: 0.025
    oversample: 4
    truncate_sigma: 4.0

training:
  # This grid and its opacity-guided refinement apply only to LTE rays in the
  # lower line-formation domain.
  depth_sampling:
    sample_count: 25
    coarse_to_fine:
      enabled: true
      fine_sample_count: 16
      uniform_weight_floor: 0.05
  vector_regularization:
    enabled: false
    magnetic_weight: 0.0
    velocity_weight: 0.0
    decay_steps: 0
  physics:
    vector_basis_matches_spatial_coordinates: true
    # Do not let the current-free top condition dominate before the lower
    # atmosphere has begun resolving the Stokes ambiguity.
    upper_boundary_current_free_ramp_steps: 10000
    collocation:
      # MHS and divB span the complete -0.1--20.0 Mm domain.
      volume_points_per_step: 2048
      height_layers_per_step: 64
      # Upper-domain priors use a separate 1.5--20.0 Mm sampler.
      upper_volume_points_per_step: 1024
      upper_height_layers_per_step: 32
      # J=0 and hydrostatically integrated gas pressure apply only at 20 Mm.
      upper_boundary_points_per_step: 256
      side_boundary_points_per_step: 0
      side_height_layers_per_step: 0
      validation_height_layers: 12
      validation_upper_height_layers: 6
      validation_points_per_height: 32
    normalization:
      length_m: 1.0e+6
      time_s: 3600.0
      magnetic_field_floor_gauss: 1.0
      velocity_scale_m_per_s: 1000.0
    equations:
      hydrostatic_equilibrium: {enabled: false, weight: 0.0}
      magnetohydrostatic_equilibrium: {enabled: true, weight: 1.0e-3}
      momentum: {enabled: false, weight: 0.0}
      magnetic_divergence: {enabled: true, weight: 1.0e-3}
      radial_magnetic_energy_gradient: {enabled: false, weight: 0.0}
      induction: {enabled: false, weight: 0.0}
      continuity: {enabled: false, weight: 0.0}
      upper_boundary_open_velocity: {enabled: true, weight: 1.0e-5}
      side_boundary_open_velocity: {enabled: false, weight: 0.0}
      upper_domain_microturbulence_prior: {enabled: true, weight: 1.0e-5}
      upper_domain_temperature_prior: {enabled: true, weight: 1.0e-5}
      upper_boundary_current_free: {enabled: true, weight: 1.0e-3}
      side_boundary_current_free: {enabled: false, weight: 0.0}
      upper_boundary_gas_pressure_prior: {enabled: true, weight: 1.0e-4}
  learning_rate:
    start: 1.0e-3
    end: 1.0e-4
    iterations: auto

loss:
  type: huber
  # Effective errors in the stored disk-center atlas-continuum units. Stokes I
  # includes unresolved structure/model discrepancy; Q/U/V track the measured
  # continuum polarization floor of these observations.
  stokes_sigmas: {i: 5.0e-3, q: 2.0e-3, u: 2.0e-3, v: 2.0e-3}
  huber_delta: 1.0
  # Relative preferences are normalized to sum to one at runtime.
  stokes_weights: {i: 1.0, q: 1.0, u: 1.0, v: 1.0}

diagnostics:
  validation_every_n_epochs: 1
  visualization:
    enabled: true
    every_n_validations: 1
    ray_sampling:
      batch_size: 1024
      max_pixels: 16384
      max_profile_samples: 4096
    slice_sampling:
      batch_size: 1024
      layer_count: 6
      longitude_points: 256
      latitude_points: 256
      radial_points: 256
    dpi: 220
    meridional_slice:
      enabled: true
      longitude_deg: 36.0
    include_initial: true

runtime:
  max_epochs: 500
  log_every_n_steps: 10
  gradient_clip_norm: 0.1

logging:
  type: wandb
  project: PROM3THEUS
  tags:
    [hinode, sot-sp, lte, mhs, extrapolation, current-free-top, spherical-shell,
     carrington, full-resolution, "20110214_000004"]
  run_name: Hinode LTE MHS extrapolation 20110214_000004
