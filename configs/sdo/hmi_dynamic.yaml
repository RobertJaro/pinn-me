# sdo/hmi_dynamic
# Run-defining settings and overrides; omitted options use schema defaults.
schema_version: 5
solver:
  kind: joint
  output_directory: /glade/work/rjarolim/lte/hmi_subframe_dynamic_extrapolation_v09
  work_directory: /glade/derecho/scratch/rjarolim/lte/hmi_subframe_dynamic_extrapolation_v09
scene:
  reference_stream: photospheric_stokes
atmosphere:
  geometry:
    type: spherical_shell
    time_dependent: true
    height_input_scale_m: 10000000.0
    outer_height_megameter: 50.0
    inner_height_megameter: -0.5
    tangent_margin_m: 1000.0
    line_formation_outer_height_megameter: 1.5
    uniform_spatial_scaling: true
  reference_atmosphere: falc_82
  parameters:
    temperature:
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
    magnetic_field:
      scale_gauss: 100.0
      representation: vector_potential
    microturbulence:
      log_scale: 0.2
    gas_pressure:
      log_scale: 0.5
  network:
    type: siren
    hidden_dimension: 256
    hidden_layers: 8
    radial_weighting: null
  upper_atmosphere:
    type: hydrostatic_corona
    transition_region_top_megameter: 2.5
    coronal_temperature_k: 1000000.0
synthesis:
  windows:
    - id: fe_i_6173
      line_ids:
        - FeI_6173.3352
      wavelength_bounds_vacuum_angstrom:
        - 6172.0
        - 6179.0
      radiance_scale: 25000000000000.0
      depth_count: 257
      jitter_fraction: 1.0
      transfer_precision: float32
      shell_height_bounds_megameter:
        - -0.5
        - 1.5
      lateral_halo_megameter: 5.0
physics:
  vector_basis_matches_spatial_coordinates: true
  collocation:
    volume_points_per_step: 2048
    height_layers_per_step: 64
    upper_boundary_points_per_step: 256
    validation_height_layers: 12
    validation_points_per_height: 32
    upper_volume_points_per_step: 1024
    upper_height_layers_per_step: 32
    side_boundary_points_per_step: 512
    validation_side_boundary_points: 256
    validation_upper_height_layers: 6
    volume_sampling: fully_random
    hard_example_enabled: true
    hard_example_count: 256
    hard_example_start_step: 500
    hard_example_jitter_time_hours: 0.05
  normalization:
    length_m: 1000000.0
    time_s: 3600.0
    force_balance_pressure_floor_pa: 1.0
  equations:
    momentum:
      enabled: true
      weight: 0.003
    magnetic_divergence:
      enabled: true
      weight: 1.0
    induction:
      enabled: true
      weight: 0.03
    continuity:
      enabled: true
      weight: 0.01
    upper_boundary_gas_pressure_prior:
      enabled: true
      weight: 0.0001
    vector_potential_gauge:
      enabled: true
      weight: 0.1
    magnetic_current_free:
      enabled: true
      weight: 1.0
    upper_boundary_no_inflow:
      enabled: true
      weight: 1.0
    side_boundary_no_inflow:
      enabled: true
      weight: 1.0
  magnetic_current_free_steps: 5000
  magnetic_current_free_final_factor: 0.1
  potential_boundary:
    enabled: true
    start_step: 5000
    ramp_steps: 4000
    freeze_step: 14000
  loss_start_step: 1500
  loss_ramp_steps: 2500
  robust_loss_delta: 1.0
atmosphere_regularization: []
streams:
  - id: photospheric_stokes
    observation:
      type: hmi_stokes
      directory: /glade/work/rjarolim/data/hmi_stokes/20240323_720s_subframe
      selection:
        validation_raster: 10
      loader:
        batch_size: 256
        validation_batch_size: 64
        validation_stride: 16
        preparation_workers: 8
        workers: 8
      calibration:
        transmission_profile_directory: /glade/work/rjarolim/data/hmi_calibration/20240323
        require_quality_zero: true
        quiet_sun_max_fractional_polarization: 0.01
        quiet_sun_trim_quantiles:
          - 0.05
          - 0.95
        minimum_quiet_sun_pixels: 128
        calibration_sample_limit: 4096
    data_term:
      type: lte_stokes
      synthesis_window: fe_i_6173
      weight: 1.0
      instrument:
        type: hmi_filter_profiles
        magnetic_azimuth_offset_deg: 90.0
        optimize_line_of_sight_velocity_correction: true
      objective:
        type: mse
        stokes_weights: {i: 1.0, q: 1.0, u: 1.0, v: 1.0}
        qu_warmup_steps: 0
        continuum_normalization: true
        stokes_scales: {I: 1.0, Q: 0.1, U: 0.1, V: 0.1}
      weight_schedule:
        initial_weight: 10.0
        initial_steps: 3000
        ramp_steps: 3000
diagnostics:
  visualization:
    enabled: true
    ray_sampling:
      batch_size: 512
      max_pixels: 4096
      max_profile_samples: 2048
    slice_sampling:
      batch_size: 512
      longitude_points: 128
      latitude_points: 128
      radial_points: 256
    meridional_slice:
      enabled: true
      longitude_deg: 215.0
training:
  max_steps: -1
  learning_rate: 0.0001
  final_learning_rate: 1.0e-05
  max_epochs: 500
  reference_stream: photospheric_stokes
  loss_balance:
    enabled: false
    target_gradient_fraction: 0.1
    included_objectives:
      - shared.physics.momentum
      - shared.physics.magnetic_divergence
      - shared.physics.magnetic_current_free
      - shared.physics.induction
      - shared.physics.continuity
logging:
  type: wandb
  project: PROM3THEUS
  run_name: HMI LTE dynamic 50 megameter extrapolation 2024-03-23/24
  tags:
    - hmi
    - sdo
    - fe6173
    - lte
    - dynamic-mhd
    - extrapolation
    - progressive-potential-outflow-boundary
    - spherical-shell
    - phase-map-response
