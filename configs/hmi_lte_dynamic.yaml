# Single-stream inversion through the joint runtime.
schema_version: 3
solver:
  kind: joint
  output_directory: /glade/work/rjarolim/lte/hmi_subframe_dynamic_extrapolation_v09
  work_directory: /glade/derecho/scratch/rjarolim/lte/hmi_subframe_dynamic_extrapolation_v09
scene:
  reference_stream: photospheric_stokes
atmosphere:
  geometry:
    type: spherical_shell
    time_dependent: true
    height_input_scale_m: 10000000.0
    uniform_spatial_scaling: true  # Use the height scale for all spatial inputs.
    outer_height_megameter: 50.0
    line_formation_outer_height_megameter: 1.5
    inner_height_megameter: -0.1
    tangent_margin_m: 1000.0
  reference_atmosphere: falc_82
  upper_atmosphere:
    type: hydrostatic_corona
    transition_region_top_megameter: 2.5
    coronal_temperature_k: 1000000.0
    reference_grid_points: 2048
  parameters:
    temperature:
      log_scale: 0.1
    velocity:
      scale_m_per_s: 1000.0
      maximum_m_per_s: 100000.0
    magnetic_field:
      scale_gauss: 100.0
      representation: vector_potential
    microturbulence:
      log_scale: 0.2
    gas_pressure:
      log_scale: 0.5
  network:
    type: siren
    hidden_dimension: 256
    hidden_layers: 8
    first_omega_0: 30.0
    hidden_omega_0: 1.0
    radial_weighting: null  # No radial warp; time retains independent scaling.
physics:
  vector_basis_matches_spatial_coordinates: true
  # Give the photospheric Stokes fit a clean initial phase before volume
  # physics and the detached outer-boundary target become influential.
  loss_start_step: 1500
  loss_ramp_steps: 2500
  robust_loss_delta: 1.0
  adiabatic_index: 1.6666666666666667
  magnetic_current_free_steps: 5000
  # Retain weak quadratic curl regularization after the initial phase.
  magnetic_current_free_final_factor: 0.1
  potential_boundary:
    enabled: true
    geometry: spherical_neumann
    source_height_megameter: 0.0
    start_step: 5000
    ramp_steps: 4000
    update_every_n_steps: 500
    freeze_step: 14000
    blend: 0.5
    weight: 1.0
    grid_size: 64
    source_supersampling: 2
    top_grid_size: 16
    side_horizontal_points: 32
    side_height_points: 16
    jitter_fraction: 1.0
    seed: 0
    batch_size: 256
    field_floor_gauss: 1.0
    photosphere:
      enabled: false
      batch_size: 256
      weight: 0.1
      start_step: 500
      ramp_steps: 500
      end_step: 8000
  collocation:
    volume_points_per_step: 2048
    height_layers_per_step: 64
    upper_volume_points_per_step: 1024
    upper_height_layers_per_step: 32
    upper_boundary_points_per_step: 256
    side_boundary_points_per_step: 512
    validation_side_boundary_points: 256
    validation_height_layers: 12
    validation_upper_height_layers: 6
    validation_points_per_height: 32
    height_sampling_power: 1.0
    residual_adaptive_enabled: true
    residual_adaptive_candidate_multiplier: 2
    residual_adaptive_fraction: 0.5
    residual_adaptive_start_step: 500
    residual_adaptive_update_every_n_steps: 250
  normalization:
    length_m: 1000000.0
    time_s: 3600.0
    magnetic_field_floor_gauss: 1.0
    velocity_scale_m_per_s: 1000.0
    force_balance_pressure_floor_pa: 1.0
  equations:
    hydrostatic_equilibrium:
      enabled: false
      weight: 0.0
    magnetohydrostatic_equilibrium:
      enabled: false
      weight: 0.0
    momentum:
      enabled: true
      weight: 0.003
    magnetic_divergence:
      enabled: true
      weight: 1.0
    magnetic_current_free:
      enabled: true
      weight: 1.0
    radial_magnetic_energy_gradient:
      enabled: false
      weight: 0.0
    radial_magnetic_field:
      enabled: false
      weight: 0.0
    induction:
      enabled: true
      weight: 0.03
    continuity:
      enabled: true
      weight: 0.01
    adiabatic_pressure:
      enabled: false
      weight: 0.0
    # Top and sides: progressive potential-field matching and no inflow.
    upper_boundary_current_free:
      enabled: false
      weight: 0.0
    side_boundary_current_free:
      enabled: false
      weight: 0.0
    upper_boundary_no_inflow:
      enabled: true
      weight: 1.0
    side_boundary_no_inflow:
      enabled: true
      weight: 1.0
    upper_boundary_open_velocity:
      enabled: false
      weight: 0.0
    side_boundary_open_velocity:
      enabled: false
      weight: 0.0
    upper_domain_microturbulence_prior:
      enabled: true
      weight: 0.001
    upper_domain_temperature_prior:
      enabled: true
      weight: 0.001
    upper_boundary_tangential_magnetic_neumann:
      enabled: false
      weight: 0.0
    side_boundary_tangential_magnetic_neumann:
      enabled: false
      weight: 0.0
    upper_boundary_gas_pressure_prior:
      enabled: true
      weight: 0.0001
atmosphere_regularization:
  - id: vector_potential_regularization
    type: vector_potential
    gauge_weight: 0.1
    smoothness_weight: 0.001
    sample_count: 1024
    height_layers: 32
    domain: full_shell
    smoothness_step_megameter: 0.25
streams:
- id: photospheric_stokes
  observation:
    type: hmi_stokes
    directory: /glade/work/rjarolim/data/hmi_stokes/20240323_720s_subframe
    selection:
      acquisition_indices: null
      validation_raster: 10
    loader:
      batch_size: 256
      validation_batch_size: 64
      validation_stride: 16
      preparation_workers: 8
      workers: 8
      pin_memory: false
      progress: true
    calibration:
      transmission_profile_directory: /glade/work/rjarolim/data/hmi_calibration/20240323
      require_quality_zero: true
      quiet_sun_max_fractional_polarization: 0.01
      quiet_sun_trim_quantiles:
      - 0.05
      - 0.95
      minimum_quiet_sun_pixels: 128
      calibration_sample_limit: 4096
  data_term:
    type: lte_stokes
    weight: 1.0
    weight_schedule:
      initial_weight: 10.0
      initial_steps: 3000
      ramp_steps: 3000
    synthesis:
      line_ids:
      - FeI_6173.3352
      excluded_wavelength_windows_angstrom: []
    instrument:
      type: hmi_filter_profiles
      magnetic_azimuth_offset_deg: 90.0
      line_of_sight_velocity_correction_m_per_s: 0.0
      optimize_line_of_sight_velocity_correction: true
    objective:
      type: mse
      stokes_weights: {i: 1290.32258065, q: 504032.258065, u: 504032.258065, v: 504032.258065}
    depth_sampling:
      # FALC reference coordinates shape Stokes quadrature; the model uses height.
      reference_log_tau500_bounds: [-5.0, 1.0]
      sample_count: 25
      coarse_to_fine:
        enabled: true
        fine_sample_count: 16
        uniform_weight_floor: 0.05
diagnostics:
  visualization:
    enabled: true
    ray_sampling:
      batch_size: 512
      max_pixels: 4096
      max_profile_samples: 2048
    slice_sampling:
      batch_size: 512
      layer_count: 6
      longitude_points: 128
      latitude_points: 128
      radial_points: 256
    dpi: 180
    meridional_slice:
      enabled: true
      longitude_deg: 215.0
training:
  loader_seed: 0
  reader_workers: 2  # Global maximum concurrent bulk reads.
  loader_block_bytes: 33554432
  loader_cache_bytes: 134217728  # Per observation stream, across its channels.
  loader_prefetch_batches: 2
  loader_max_batch_bytes: 67108864
  gpu_prefetch: true
  max_steps: -1
  max_epochs: 500
  learning_rate: 3.0e-4
  final_learning_rate: 3.0e-5
  gradient_clip_norm: 0.1
  log_every_n_steps: 10
  warmup_steps: 1000
  loss_balance:
    enabled: true
    start_step: 250
    update_every_n_steps: 100
    ema_decay: 0.9
    adaptation_rate: 0.1
    # Each shared residual remains a small correction to the Stokes anchor.
    target_gradient_fraction: 0.1
    min_multiplier: 0.01
    max_multiplier: 100.0
    probe_parameter_count: 4
    excluded_objectives:
      - shared.potential_boundary.top
      - shared.potential_boundary.side
  reference_stream: photospheric_stokes
logging:
  type: wandb
  project: PROM3THEUS
  tags:
  - hmi
  - sdo
  - fe6173
  - lte
  - dynamic-mhd
  - extrapolation
  - progressive-potential-outflow-boundary
  - spherical-shell
  - phase-map-response
  run_name: HMI LTE dynamic 50 Mm extrapolation 2024-03-23/24
