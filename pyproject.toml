[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PROM3THEUS"
dynamic = ["version"]
description = "Differentiable LTE spectropolarimetric inversions with physics-informed neural networks"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  {name = "Robert Jarolim"},
  {name = "Momchil Molnar"},
]
dependencies = [
  "numpy>=1.23",
  "pytorch-lightning>=2.6,<3",
  "PyYAML>=6",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
muon = ["torch>=2.9,<3"]
observations = [
  "astropy>=5",
  "python-dateutil>=2.8.2",
  "sunpy[map]>=5",
  "tqdm>=4.61.2",
]
hmi-preparation = [
  "astropy>=5",
  "drms>=0.6.2",
  "python-dateutil>=2.8.2",
  "sunpy[map]>=5",
  "tqdm>=4.61.2",
]
aia-preparation = [
  "aiapy==0.12.1",
  "astropy>=7.1.1",
  "drms>=0.6.2",
  "python-dateutil>=2.8.2",
  "sunpy[image,map,net]>=7.0",
  "tqdm>=4.61.2",
]
visualization = [
  "matplotlib>=3.6",
  "sunpy>=5",
  "wandb>=0.13",
]
test = [
  "astropy>=5",
  "build>=1",
  "matplotlib>=3.6",
  "pytest>=8",
  "python-dateutil>=2.8.2",
  "setuptools>=77",
  "sunpy[map]>=5",
  "tqdm>=4.61.2",
  "wheel>=0.43",
]

[project.scripts]
prom3theus = "prom3theus.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["prom3theus*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "prom3theus.__version__"}

[tool.setuptools.package-data]
"prom3theus.resources" = [
  "data/*.json",
  "data/common/*.json",
  "data/hinode_sp/*.json",
  "data/hmi_stokes/*.json",
  "sets/euv/aia_euv_v1/*.json",
  "sets/plasma/plasma_v1/*.json",
]

[tool.setuptools.data-files]
"share/prom3theus/configs/hinode" = [
  "configs/hinode/mhs.yaml",
  "configs/hinode/mhs_extrapolation.yaml",
]
"share/prom3theus/configs/sdo" = [
  "configs/sdo/hmi_aia_dynamic.yaml",
  "configs/sdo/hmi_aia_energy.yaml",
]
"share/prom3theus/configs/muram/hinode" = [
  "configs/muram/hinode/mhs.yaml",
  "configs/muram/hinode/stokes_only.yaml",
  "configs/muram/hinode/surrogate.yaml",
  "configs/muram/hinode/synthesis.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires optional external scientific data or a comparatively slow end-to-end run",
]
