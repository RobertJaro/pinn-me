---
# CPU-sized diagnostic for early LTE intensity convergence. This deliberately
# uses a quiet-Sun patch so the atlas calibration is identifiable inside the
# selected crop; it is not a replacement for the full-resolution run.
base_path: "/Users/rjarolim/PycharmProjects/pinn-lte/runs/hinode_lte_atlas_diagnostic"
work_directory: "/Users/rjarolim/PycharmProjects/pinn-lte/runs/hinode_lte_atlas_diagnostic"
seed: 17

resources:
  directory: "/Users/rjarolim/PycharmProjects/pinn-lte/pme/lte/data"
  instrument: "Hinode/SOT-SP"

data:
  type: hinode_lte
  files: "/Users/rjarolim/PycharmProjects/pinn-me/data/hinode/20070105_235907/*.fits"
  scan_slice: [0, 16]
  slit_slice: [0, 16]
  batch_size: 64
  validation_batch_size: 64
  validation_stride: 1
  num_workers: 0
  continuum_edge_samples: 8
  quiet_sun_max_fractional_polarization: 1.0e-2
  quiet_sun_continuum_trim_quantiles: [0.05, 0.95]
  minimum_quiet_sun_pixels: 128

atmosphere:
  coordinate_mode: geometric_height
  log_tau500: {min: -5.0, max: 1.0, count: 51}
  height_input_scale_m: 1000000.0
  height_mapping_config:
    base_scale_m_per_log_tau: 150000.0
    gauge_log_tau500: 0.0
    gauge_quadrature_points: 128
    model_config:
      type: mlp
      dim: 32
      n_layers: 3
      activation: swish
      encoding_config:
        type: fourier
        num_frequencies: [8, 8, 12]
        max_frequencies: [4, 4, 4]
        include_input: true
  temperature_log10_bounds: [3.4, 4.0]
  temperature_log_scale: 0.2
  velocity_scale_m_per_s: 1000.0
  magnetic_scale_gauss: 100.0
  microturbulence_log10_bounds: [1.0, 4.0]
  gas_pressure_log10_bounds: [-1.5, 6.0]
  gas_pressure_log_scale: 1.0
  model_config:
    type: mlp
    dim: 64
    n_layers: 4
    activation: swish
    encoding_config:
      type: fourier
      num_frequencies: [12, 12, 16]
      max_frequencies: [4, 4, 8]
      include_input: true

synthesis:
  line_ids: [FeI_6301.5008, FeI_6302.4932]

instrument:
  fwhm_angstrom: 0.025
  oversample: 2
  truncate_sigma: 4.0

training:
  depth_sampling_config:
    sample_count: 12
  physics_config:
    volume_points_per_step: 128
    points_per_tau: 16
    boundary_points_per_step: 64
    validation_depth_points: 33
    vector_basis_matches_spatial_coordinates: true
    equations:
      tau_mapping: {enabled: true, weight: 1.0}
      hse: {enabled: true, weight: 1.0}
      divergence_b: {enabled: true, weight: 1.0}
      pressure_boundary: {enabled: true, weight: 1.0e-2}
  wavelength_exclude_windows_angstrom: [[6302.04, 6302.14]]
  lr_params: {start: 1.0e-3, end: 3.0e-4, iterations: auto}

normalization:
  asinh_alphas: {Q: 1.0e-2, U: 1.0e-2, V: 1.0e-2}

stokes_loss: {type: mse}
weight: {I: 1.0, Q: 1.0, U: 1.0, V: 1.0}

check_val_every_n_epoch: 1
visualization:
  enabled: true
  every_n_epochs: 1
  depth_layer_count: 4
  evaluation_batch_size: 256
  max_map_pixels: 256
  max_profile_samples: 256
  dpi: 120
  include_initial: true
  yz_slice: {enabled: false}

trainer:
  max_epochs: 8
  log_every_n_steps: 1
  enable_progress_bar: false
  deterministic: true

logging:
  type: csv
  name: diagnostic
