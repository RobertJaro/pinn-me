---
# CPU-sized diagnostic for early LTE intensity convergence. This deliberately
# uses a quiet-Sun patch so the atlas calibration is identifiable inside the
# selected crop; it is not a replacement for the full-resolution run.
base_path: "/Users/rjarolim/PycharmProjects/pinn-lte/runs/hinode_lte_spherical_falc_diagnostic"
work_directory: "/Users/rjarolim/PycharmProjects/pinn-lte/runs/hinode_lte_spherical_falc_diagnostic"
resources:
  directory: "/Users/rjarolim/PycharmProjects/pinn-lte/pme/lte/data"
  instrument: "Hinode/SOT-SP"

data:
  type: hinode_lte
  files: "/Users/rjarolim/PycharmProjects/pinn-me/data/hinode/20070105_235907/*.fits"
  scan_slice: [0, 16]
  slit_slice: [0, 16]
  batch_size: 64
  validation_batch_size: 64
  validation_stride: 1
  num_workers: 0
  continuum_edge_samples: 8
  quiet_sun_max_fractional_polarization: 1.0e-2
  quiet_sun_continuum_trim_quantiles: [0.05, 0.95]
  minimum_quiet_sun_pixels: 128
  # sp_prep Level-1 already rotates Q/U with CROTA2 into the solar frame;
  # +Q is along solar east-west (HPC +X), so no second rotation is applied.
  stokes_reference_angle_deg: 0.0

atmosphere:
  # Physical spherical atmosphere with exact observer-ray path integration.
  log_tau500: {min: -5.0, max: 1.0, count: 51}
  height_input_scale_m: 1000000.0
  # Radial offsets from R_sun in megametres.
  shell_height_bounds_Mm: [1.5, -0.1]
  tangent_margin_m: 1000.0
  reference_atmosphere_config: falc_82
  temperature_log10_bounds: [3.4, 4.0]
  temperature_log_scale: 0.1
  velocity_scale_m_per_s: 1000.0
  velocity_max_m_per_s: 100000.0
  magnetic_scale_gauss: 100.0
  microturbulence_log10_bounds: [1.0, 4.0]
  microturbulence_log_scale: 0.2
  gas_pressure_log10_bounds: [-1.5, 6.0]
  gas_pressure_log_scale: 0.5
  model_config:
    type: mlp
    dim: 64
    n_layers: 4
    activation: swish
    encoding_config:
      type: fourier
      num_frequencies: [12, 12, 16]
      max_frequencies: [4, 4, 8]
      include_input: true

synthesis:
  line_ids: [FeI_6301.5008, FeI_6302.4932]

instrument:
  fwhm_angstrom: 0.025
  oversample: 2
  truncate_sigma: 4.0

training:
  depth_sampling_config:
    sample_count: 51
    coarse_to_fine:
      enabled: true
      fine_sample_count: 32
      uniform_weight_floor: 0.05
  physics_config:
    volume_points_per_step: 128
    # Four height layers with 32 independently sampled observed-domain
    # positions per layer.
    height_layers_per_step: 4
    optical_depth_anchor_points_per_step: 64
    optical_depth_anchor_depth_points: 65
    validation_depth_points: 33
    vector_basis_matches_spatial_coordinates: true
    equations:
      # Use fixed weights so changes in the fit can be attributed to the model
      # and equations rather than to a changing objective.
      magnetohydrostatic_equilibrium:
        enabled: true
        weight: 1.0e-3
      magnetic_divergence:
        enabled: true
        weight: 1.0e-3
      mean_radial_optical_depth_anchor:
        enabled: true
        weight: 1.0e-3
      upper_boundary_gas_pressure_prior:
        enabled: true
        weight: 1.0e-4
  wavelength_exclude_windows_angstrom: [[6302.04, 6302.14]]
  learning_rate: 1.0e-5

normalization:
  asinh_alphas: {Q: 1.0e-2, U: 1.0e-2, V: 1.0e-2}

stokes_loss: {type: mse}
weight: {I: 1.0, Q: 1.0, U: 1.0, V: 1.0}

check_val_every_n_epoch: 1
visualization:
  enabled: true
  every_n_epochs: 1
  ray_sampling: {batch_size: 256, max_pixels: 256, max_profile_samples: 256}
  slice_sampling:
    batch_size: 256
    layer_count: 4
    longitude_points: 32
    latitude_points: 32
    radial_points: 48
  dpi: 120
  include_initial: true
  meridional_slice: {enabled: false}

trainer:
  max_epochs: 8
  log_every_n_steps: 1
  enable_progress_bar: false
  deterministic: true

logging:
  type: csv
  name: spherical_falc
