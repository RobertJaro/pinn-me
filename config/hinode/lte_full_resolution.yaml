---
# Full native Hinode/SOT-SP raster: 1024 scan positions x 512 slit pixels x
# all 112 calibrated wavelength samples. Atomic/instrument resources must be
# prepared before training; this run performs no network downloads.
base_path: "/glade/work/rjarolim/lte/hinode_lte_v23"
work_directory: "/glade/derecho/scratch/rjarolim/lte/hinode_lte_v23"

resources:
  directory: "/glade/work/rjarolim/data/inversion/hinode_sp/resources"
  instrument: "Hinode/SOT-SP"

data:
  type: hinode_lte
  files: "/glade/work/rjarolim/data/inversion/hinode_sp/20110122_093128/*.fits"
  # Explicit native detector extent. Python slice stops are exclusive.
  scan_slice: [0, 1024]
  slit_slice: [0, 512]
  # One epoch traverses every valid inversion pixel exactly once.
  batch_size: 256
  # Coarse-to-fine synthesis uses 57 final ray points. Keep validation chunks
  # smaller so the wavelength-depth Faddeeva tensor does not compete with the
  # resident model/optimizer state at the end of a training epoch.
  validation_batch_size: 64
  # A deterministic 1/16 diagnostic sample covers the full raster on a 4x4
  # detector lattice (128x256 map samples for the native 512x1024 raster).
  # It is not a held-out set. Set this to 1 only when the cost of synthesizing
  # all 524,288 Stokes profiles at every validation epoch is acceptable.
  validation_stride: 16
  # Worker count is an operational choice for the target system. All loaders
  # still use pin_memory=false as required.
  num_workers: 8
  continuum_edge_samples: 8
  # Calibrate one detector response from a conservative quiet-Sun subset.
  # The same scalar is applied to I,Q,U,V; no pixel or raster continuum is
  # normalized away. Profiles are stored in fixed disk-center atlas-Ic units.
  quiet_sun_max_fractional_polarization: 1.0e-2
  quiet_sun_continuum_trim_quantiles: [0.05, 0.95]
  minimum_quiet_sun_pixels: 1024
  # sp_prep Level-1 has already used CROTA2 to rotate Q/U from the FPP frame
  # into the solar frame, with +Q along solar east-west (HPC +X). Keep this at
  # zero: applying CROTA2 here would rotate the calibrated profiles twice.
  stokes_reference_angle_deg: 0.0

atmosphere:
  # Evaluate one physical atmosphere F(X,Y,r) along the exact observer rays.
  # The radial grid follows the pinned FALC reference; tau is derived by
  # integrating positive opacity over the realized ray segments.
  log_tau500: {min: -5.0, max: 1.0, count: 51}
  height_input_scale_m: 1000000.0
  # Radial offsets from R_sun in megametres.
  shell_height_bounds_Mm: [1.5, -0.1]
  tangent_margin_m: 1000.0
  reference_atmosphere_config: falc_82
  # Smooth natural-log decoder constrained to the calibrated STiC table.
  temperature_log10_bounds: [3.4, 4.0]
  # Thermodynamic channels are bounded log perturbations around FALC.
  temperature_log_scale: 0.1
  # Vector decoders matching the spherical inversion convention. One raw
  # network unit is locally 1000 m/s or linearly 100 G. Hidden layers use
  # variance-preserving random initialization; readout weights and biases also
  # remain random. These explicit scales set the physical magnitude without
  # special-casing any output channel.
  velocity_scale_m_per_s: 1000.0
  # Smooth component-wise bound; the local derivative at zero remains the
  # velocity scale above, while every observer projection stays subluminal.
  velocity_max_m_per_s: 100000.0
  magnetic_scale_gauss: 100.0
  microturbulence_log10_bounds: [1.0, 4.0]
  microturbulence_log_scale: 0.2
  # Exact calibrated STiC pressure-table bounds. The smooth decoder approaches
  # but never crosses these endpoints. Natural-log sensitivity is one per raw
  # network unit near initialization.
  gas_pressure_log10_bounds: [-1.5, 6.0]
  gas_pressure_log_scale: 0.5
  # A slit scan mixes acquisition time with scan-x, so infer the requested
  # static smooth field rather than an unidentifiable time dependence. Public
  # coordinates are [time_hours, Carrington-chart X Mm, chart Y Mm]; the entry
  # point injects the raster-derived affine and solar-Cartesian scene basis.
  # The network receives normalized chart X/Y and physical radial height.
  model_config:
    type: mlp
    dim: 256
    n_layers: 8
    activation: swish
    # Inputs are normalized Carrington-chart X/Y and radius offset. Retain the
    # full horizontal Fourier bank but use only four radial frequencies to
    # suppress poorly constrained fine height structure.
    encoding_config:
      type: fourier
      num_frequencies: [64, 64, 16]
      max_frequencies: [64, 64, 16]
      include_input: true

synthesis:
  # Joint synthesis of the complete Hinode/SP Fe I line pair.
  line_ids: [FeI_6301.5008, FeI_6302.4932]

instrument:
  # Gaussian approximation to the approximately 25 mA pre-launch measured
  # spectral response. The exact 112-point detector grid comes from the FITS.
  fwhm_angstrom: 0.025
  oversample: 4
  truncate_sigma: 4.0

training:
  # Use 51 FALC-spaced radial samples; the actual optical-depth increments are
  # obtained from alpha500*ds on each realized observer ray.
  depth_sampling_config:
    sample_count: 25
    coarse_to_fine:
      enabled: true
      fine_sample_count: 32
      uniform_weight_floor: 0.05
  # All differential constraints are evaluated in solar Cartesian space.
  physics_config:
    volume_points_per_step: 1024
    # Thirty-two height layers with 32 independently sampled observed-domain
    # positions per layer.
    height_layers_per_step: 32
    # Atmosphere vectors and derivatives use Heliographic Carrington Cartesian
    # components; the observer Stokes projection is applied only for synthesis.
    vector_basis_matches_spatial_coordinates: true
    optical_depth_anchor_points_per_step: 256
    optical_depth_anchor_depth_points: 65
    validation_depth_points: 65
    equations:
      magnetohydrostatic_equilibrium:
        enabled: true
        # Full pressure, gravity, and Lorentz-force balance in the physical atmosphere.
        weight: 1.0e-3
      magnetic_divergence:
        enabled: true
        weight: 1.0e-3
      mean_radial_optical_depth_anchor:
        enabled: true
        # Place the mean radial tau500=1 surface at the solar radius.
        weight: 1.0e-3
      upper_boundary_gas_pressure_prior:
        enabled: true
        # Weakly retain the FALC pressure at the upper shell boundary.
        weight: 1.0e-4
  # Unsupported molecular absorption in cool umbrae is excluded from the fit.
  wavelength_exclude_windows_angstrom: [[6302.04, 6302.14]]
  learning_rate:
    start: 1.0e-3
    end: 1.0e-4
    iterations: auto

# Requested HMI objective convention: linear I, asinh-scaled polarization and
# equal component weights. This is a fit objective, not a Hinode noise chi^2.
normalization:
  asinh_alphas: {Q: 1.0e-2, U: 1.0e-2, V: 1.0e-2}

stokes_loss:
  type: mse

weight:
  I: 1.0
  Q: 1.0
  U: 1.0
  V: 1.0

check_val_every_n_epoch: 1
visualization:
  enabled: true
  every_n_epochs: 1
  # Observer rays are used only for the tau diagnostic and Stokes comparison.
  ray_sampling:
    batch_size: 1024
    max_pixels: 16384
    max_profile_samples: 4096
  # Atmosphere panels sample only the requested physical shell surfaces and
  # radial plane; no longitude-latitude-radius cube is constructed.
  slice_sampling:
    batch_size: 1024
    layer_count: 4
    longitude_points: 256
    latitude_points: 256
    radial_points: 192
  dpi: 220
  # Constant-Carrington-longitude radial plane resolved from this chart X.
  meridional_slice:
    enabled: true
    longitude_deg: -14.0
  # Immediately log the randomly initialized atmosphere panels; Stokes
  # comparison is added after each completed validation epoch.
  include_initial: true

trainer:
  max_epochs: 500
  log_every_n_steps: 1

logging:
  type: wandb
  project: pinn-me-lte
  tags: [hinode, sot-sp, lte, spherical-shell, carrington, magnetohydrostatic-equilibrium, full-resolution]
  name: Hinode LTE
