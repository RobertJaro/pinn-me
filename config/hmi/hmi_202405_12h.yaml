base_path: "/glade/work/rjarolim/spinn_me/hmi/202405_12h_v31"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me_v3/202405_12h_v01"
data:
  train_configs:
    - { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/202405_12h", stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  valid_config: { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/202405_12h", sample_idx: 7, stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  ref_time: "2024-05-01T00:00:00"
  num_workers: 16
  batch_size: 262144
  dataset_batch_size: 8192
  seconds_per_dt: 86400 # 1 day
  gauss_per_dB: 1000

instrument:
  - type: 'hmi'
    instrument_id: 'HMI'
    limb_correction: False

logging:
  project: pinn-me-spherical
  tags: [ "hmi" ]
