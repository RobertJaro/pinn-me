  encoding_config: {type: spatiotemporal}


training:
  epochs: 500
  lambda_stokes: [ 1, 1, 1, 1 ]
  lambda_induction: 0 #{ start: 1.0e-2, end: 1.0e-6, iterations: 5.0e+4 }
  lambda_divergence: 0 #{ start: 1.0e-2, end: 1.0e-6, iterations: 5.0e+4 }
  lambda_force_free: 0 #{ start: 1.0e-2, end: 1.0e-6, iterations: 5.0e+4 }