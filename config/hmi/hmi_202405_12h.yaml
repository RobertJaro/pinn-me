model:
  encoding_config: {type: spatiotemporal} #{ type: positional, max_frequencies: [2.0, 8.0, 8.0, 8.0], num_frequencies: [16, 64, 64, 64] }#{ type: progressive_positional, max_frequencies: [1.0, 8.0, 8.0, 8.0], num_frequencies: [8, 32, 32, 32] }#{ type: spherical, scales: [1.0, 1.0, 128.0, 128.0, 128.0, 128.0], num_frequencies: [16, 0, 64, 64, 64, 64]}

training:
  epochs: 1000
  lambda_stokes: [ 1.0, 0.2, 0.2, 1.0 ]
  check_val_every_n_epoch: 2
  time_shift_config: {scale: 0.0, iterations: 0.0}
  lambda_divergence: 1.0e-3
  lambda_force_free: 1.0e-3