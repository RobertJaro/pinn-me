---
base_path: "/glade/work/rjarolim/spinn_me/combined/combined_fd_20240327_v01"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me_v2/hmi/combined_fd_20240327_v01"
data:
  train_configs:
    - { type: 'phi-fdt', data_path: "/glade/work/rjarolim/spinn_me/align_phi/*.fits.gz", stokes_normalization: 1.0, instrument_id: 'PHI', oversample_factor: 4, fix_header: False }
    - { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/20240327", stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  valid_config: { type: 'phi-fdt', data_path: "/glade/work/rjarolim/spinn_me/align_phi/*.fits.gz", sample_idx: 1, stokes_normalization: 1.0, instrument_id: 'PHI', fix_header: False }
  ref_time: "2024-03-27T00:00:00"
  num_workers: 16
  batch_size: 262144
  dataset_batch_size: 8192
  seconds_per_dt: 86400 # 1 day
  gauss_per_dB: 1000

instrument:
  - type: 'phi'
    instrument_id: 'PHI'
    limb_correction: True
    intensity_correction: True
    artifact_correction: True
  - type: 'hmi'
    instrument_id: 'HMI'
    limb_correction: True
    intensity_correction: False

logging:
  project: pinn-me-spherical
  tags: [ "hmi", "phi" ]
  name: "2024-04-27 combined full-disk"

model:
  type: mlp
  dim: 256
  n_layers: 6
  scale: true

training:
  epochs: 10000
  check_val_every_n_epoch: 10
  time_shift_config: {scale: 0.0, iterations: 0.0}

weight:
  I: 1.0
  Q: 1.0
  U: 1.0
  V: 1.0
