---
base_path: "/glade/work/rjarolim/spinn_me/hmi/201102_VP_v01"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me_v2/201102_physics_v01"
data:
  train_configs:
    - {type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/201102_3h", stokes_normalization: 5.0e+4, instrument_id: 'HMI'}
  valid_config: {type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/201102_3h", sample_idx: 20, stokes_normalization: 5.0e+4, instrument_id: 'HMI'}
