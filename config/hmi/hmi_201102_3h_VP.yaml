  lr_params: {start: 1.0e-4, end: 1.0e-5, iterations: 1.0e+5}
  lambda_stokes: [ 1, 1, 1, 1 ]
  lambda_induction: 0.0
  lambda_divergence: 0.0
  lambda_force_free: 0.0 #{ start: 1.0e-1, end: 1.0e-4, iterations: 5.0e+4 }
  lambda_static: 0.0