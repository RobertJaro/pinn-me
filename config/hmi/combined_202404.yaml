  tags: [ "hmi" ]
  name: "2024-04 Combined"
model:
  type: mlp
  dim: 256
  n_layers: 6
  scale: true
training:
  epochs: 500
  check_val_every_n_epoch: 5
#  val_check_interval: 2000

weight:
  I: 1.0
  Q: 2.0
  U: 2.0
  V: 2.0
