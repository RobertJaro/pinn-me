---
base_path: "/glade/work/rjarolim/spinn_me/hmi/combined_202403_v01"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me/hmi/combined_202403_v01"
data:
  train_configs:
    - { type: 'hmi', data_path: "/glade/work/rjarolim/data/phi_stokes/LB5_hmi", stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
    - { type: 'phi-hrt', data_path: "/glade/work/rjarolim/data/phi_stokes/LB5/*.fits", stokes_normalization: 0.86205, instrument_id: 'PHI' }
#  valid_config: { type: 'phi-hrt', data_path: "/glade/work/rjarolim/data/phi_stokes/LB5/*.fits", sample_idx: 5, stokes_normalization: 0.86205, instrument_id: 'PHI' }
  valid_config: { type: 'hmi', data_path: "/glade/work/rjarolim/data/phi_stokes/LB5_hmi", sample_idx: 5, stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  ref_time: "2024-03-23T22:30:00"
  num_workers: 16
  batch_size: 32768
  dataset_batch_size: 4096
  seconds_per_dt: 86400 # 1 day
  gauss_per_dB: 1000
