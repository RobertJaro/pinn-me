---
base_path: "/glade/work/rjarolim/spinn_me/hmi/subframe_no_physics_v04"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me_v2/hmi/subframe_v06"
data:
  train_configs:
    - { type: 'hmi', data_path: "/glade/work/rjarolim/data/phi_stokes/subframe", stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  valid_config: { type: 'hmi', data_path: "/glade/work/rjarolim/data/phi_stokes/subframe", sample_idx: 8, stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  ref_time: "2024-05-09T00:00:00"
  num_workers: 16
  batch_size: 65536
  dataset_batch_size: 4096
  seconds_per_dt: 86400 # 1 day
  gauss_per_dB: 1000

instrument:
  - type: 'hmi'
    instrument_id: 'HMI'
    limb_correction: False
    velocity_correction: False

logging:
  project: pinn-me-spherical
  tags: [ "hmi" ]
  name: "2024-03 subframe - no physics"

model:
  type: mlp
  dim: 256
  n_layers: 6
  vector_potential: false
  scale: true
  activation: silu
  encoding_config: { type: fourier, num_frequencies: [8, 64, 64, 64], max_frequencies: [2, 2048, 2048, 2048] }

training:
  epochs: 500

weight:
  I: 1.0
  Q: 1.0
  U: 1.0
  V: 1.0
