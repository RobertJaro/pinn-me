---
base_path: "/glade/work/rjarolim/spinn_me/hmi/hmi_fd_20240323_mlp_v08"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me/hmi_fd_20240323_mlp_v08"
data:
  train_configs:
    - { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/20240323_720s", transmission_profile_directory: "/glade/work/rjarolim/data/hmi_calibration/20240323", stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  valid_config: { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/20240323_720s", sample_idx: 0, transmission_profile_directory: "/glade/work/rjarolim/data/hmi_calibration/20240323", stokes_normalization: 5.0e+4, instrument_id: 'HMI', resolution: [256, 256] }
  ref_time: "2024-03-24T01:00:00"
  num_workers: 8
  batch_size: 8192
  dataset_batch_size: 512
  seconds_per_dt: 36000 # 10 hours
  gauss_per_dB: 1000

instrument:
  - type: 'hmi'
    instrument_id: 'HMI'
    limb_correction: False

logging:
  project: pinn-me-spherical
  tags: [ "hmi", "full-disk", "all-data", "no-physics", "fourier-mlp" ]
  name: "2024-03 full-disk - HMI-resolution Fourier MLP"

model:
  type: mlp
  dim: 512
  n_layers: 8
  vector_potential: false
  activation: swish
  # FourierEncoding uses sin(pi * frequency * coordinate). A maximum of 50
  # resolves the two-sample limit of the 720 s cadence when dt=10 h. A maximum
  # of 2048 resolves the approximately two-pixel HMI spatial sampling limit.
  encoding_config:
    type: fourier
    num_frequencies: [64, 64, 64, 16]
    max_frequencies: [2048, 2048, 2048, 50]
  # Apply sinh independently to each B component (scale in G).
  b_sinh_scale: 10
  # Apply sinh independently to each velocity component (scale in km/s).
  v_sinh_scale: 1

training:
  epochs: 5000
  check_val_every_n_epoch: 1
  lr_params: { start: 1.0e-3, end: 1.0e-4, iterations: 2.0e+5 }

normalization:
  # I stays linear; Q/U/V use an asinh transition at 0.1% of local continuum.
  asinh_alphas: { Q: 1.0e-3, U: 1.0e-3, V: 1.0e-3 }

stokes_loss:
  type: mse
  # Normalize observed and predicted IQUV by their own 90th-percentile I.
  continuum_normalization: true
  continuum_quantile: 0.9

lambda:
  I: 1.0
  Q: 1.0
  U: 1.0
  V: 1.0
