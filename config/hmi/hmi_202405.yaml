---
base_path: "/glade/work/rjarolim/spinn_me/hmi/202405_v28"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me/202405_v28"
data:
  train_configs:
    - { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/202405", stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  valid_config: { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/202405", sample_idx: 8, stokes_normalization: 5.0e+4, instrument_id: 'HMI', resolution: [ 512, 512 ] }
  ref_time: "2024-05-09T00:00:00"
  num_workers: 32
  batch_size: 131072
  dataset_batch_size: 8192
  seconds_per_dt: 86400 # 1 day
  gauss_per_dB: 1000

instrument:
  - type: 'hmi'
    instrument_id: 'HMI'
    limb_correction: False

logging:
  project: pinn-me-spherical
  tags: [ "hmi" ]
  name: "2024-05 720s"

model:
  dim: 512
  encoding_config:
    type: bank_gaussian
    include_input: true
    banks:
      # initial frequencies
      - { dim: 0, num_freq: 32, scale: 2.0,  step: 0 }
      - { dim: 1, num_freq: 64, scale: 16.0, step: 0 }
      - { dim: 2, num_freq: 64, scale: 16.0, step: 0 }
      - { dim: 3, num_freq: 64, scale: 16.0, step: 0 }
      # second stage frequencies
      - { dim: 1, num_freq: 64, scale: 128.0,  step: 5000 }
      - { dim: 2, num_freq: 64, scale: 128.0,  step: 5000 }
      - { dim: 3, num_freq: 64, scale: 128.0,  step: 5000 }
      # third stage frequencies
      - { dim: 1, num_freq: 64, scale: 1024.0,  step: 10000 }
      - { dim: 2, num_freq: 64, scale: 1024.0,  step: 10000 }
      - { dim: 3, num_freq: 64, scale: 1024.0,  step: 10000 }



training:
  epochs: 1000
  check_val_every_n_epoch: 1

lambda:
  I: 1.0
  Q: 1.0
  U: 1.0
  V: 1.0
