---
base_path: "/glade/work/rjarolim/spinn_me/hmi/hmi_fd_20240323_2h_90s_v05"
work_directory: "/glade/derecho/scratch/rjarolim/spinn_me/hmi_fd_20240323_2h_90s_v03"
data:
  train_configs:
    - { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/20240323_0100_0300_90s", transmission_profile_directory: "/glade/work/rjarolim/data/hmi_calibration/20240323_0100_0300", stokes_normalization: 5.0e+4, instrument_id: 'HMI' }
  valid_config: { type: 'hmi', data_path: "/glade/work/rjarolim/data/hmi_stokes/20240323_0100_0300_90s", sample_idx: 40, transmission_profile_directory: "/glade/work/rjarolim/data/hmi_calibration/20240323_0100_0300", stokes_normalization: 5.0e+4, instrument_id: 'HMI', resolution: [256, 256] }
  ref_time: "2024-03-23T00:59:23" # UTC origin; archive interval is 01:00–03:00 TAI
  num_workers: 4
  num_dataset_workers: 16
  batch_size: 32768
  dataset_batch_size: 512
  seconds_per_dt: 36000 # 10 hours
  gauss_per_dB: 1000

instrument:
  - type: 'hmi'
    instrument_id: 'HMI'
    limb_correction: False

logging:
  project: pinn-me-spherical
  tags: [ "hmi", "full-disk", "cadence-comparison", "no-physics", "fourier-mlp" ]
  name: "2024-03-23 two-hour full-disk - 90s"

model:
  type: mlp
  dim: 512
  n_layers: 8
  vector_potential: false
  source_function: ratio
  activation: swish
  # Fixed bandwidth across cadences: sin(pi * frequency * coordinate).
  # Maximum 400 resolves 90s sampling with dt=10 h; spatial maximum 2048.
  encoding_config:
    type: fourier
    num_frequencies: [16, 64, 64, 64]
    max_frequencies: [400, 2048, 2048, 2048]
  # Apply sinh independently to each B component (scale in G).
  b_sinh_scale: 10
  # Apply sinh independently to each velocity component (scale in km/s).
  v_sinh_scale: 1

training:
  epochs: -1
  check_val_every_n_epoch: null
  val_check_interval: 2000
  lr_params: { start: 1.0e-3, end: 1.0e-4, iterations: 2.0e+5 }
  optimizer_config: { type: soap }
  compile_config: { me_solver: true, mode: default }

normalization:
  # Divide continuum-normalized profiles by fixed I/Q/U/V scales.
  asinh_alphas: null
  stokes_scales: { I: 1.0, Q: 1.0e-1, U: 1.0e-1, V: 1.0e-1 }

stokes_loss:
  type: mse
  # Normalize observed and predicted IQUV by their own 90th-percentile I.
  continuum_normalization: true
  continuum_quantile: 0.9

lambda:
  I: 1.0
  Q: 1.0
  U: 1.0
  V: 1.0

seed: 20240323
